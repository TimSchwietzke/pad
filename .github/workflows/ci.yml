name: CI

# Gate every pull request (and pushes to main) on tests + build for both halves
# of the monorepo. A red check here blocks the merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: backend (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Spin up Postgres so the integration tests run for real (not skipped).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pad
          POSTGRES_PASSWORD: pad
          POSTGRES_DB: pad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pad"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://pad:pad@localhost:5432/pad_test?sslmode=disable
      - run: go build ./...

  frontend:
    name: frontend (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run build
